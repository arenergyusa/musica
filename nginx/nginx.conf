worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hide nginx version (L16)
    server_tokens off;

    sendfile        on;
    keepalive_timeout  65;

    # Cap request body size to reject oversized uploads (L16)
    client_max_body_size 1m;

    # Rate limiting zone shared across workers (L16)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Use Docker's internal DNS resolver to dynamically resolve container IPs
    resolver 127.0.0.11 valid=10s;

    # Map for safe WebSocket Upgrade handling (L16)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP Server (HTTPS/SSL temporarily disabled until Let's Encrypt certs are issued)
    server {
        listen 80;
        server_name the-musica.com www.the-musica.com localhost _;

        # Allow Let's Encrypt to verify domain ownership
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Route /api/ to backend, rate-limited
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route everything else to frontend
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upgrade only when the client actually asks for a websocket (L16)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}