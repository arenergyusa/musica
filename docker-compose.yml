services:
  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
        - API_URL_INTERNAL=http://backend:8080
        - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
        - NEXT_PUBLIC_USDT_CONTRACT=${USDT_CONTRACT_ADDRESS:-0x55d398326f99059fF775485246999027B3197955}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL_INTERNAL=http://backend:8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - musica_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$(hostname -i):3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Go Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_URL=postgres://musica_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@db:5432/musica_db?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENVIRONMENT=production
      - SMTP_HOST=smtp.hostinger.com
      - SMTP_PORT=465
      - SMTP_USER=hello@themusica.in
      - SMTP_PASS=${SMTP_PASS:?SMTP_PASS is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - MASTER_PRIVATE_KEY=${MASTER_PRIVATE_KEY:?MASTER_PRIVATE_KEY is required}
      - BSC_RPC_URL=${BSC_RPC_URL:?BSC_RPC_URL is required}
      - USDT_CONTRACT_ADDRESS=${USDT_CONTRACT_ADDRESS:?USDT_CONTRACT_ADDRESS is required}
      - DEPOSIT_ADDRESS=${DEPOSIT_ADDRESS:?DEPOSIT_ADDRESS is required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - musica_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      # Root bootstrap role (superuser used only to build the app role/dev).
      - POSTGRES_USER=musica
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=musica_db
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - musica_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musica -d musica_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis Cache & Session (auth enabled: L23)
  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - musica_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx API Gateway (pinned + hardened: L16, L18)
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443" # For production with SSL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - musica_net
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    restart: unless-stopped

  # Certbot (Automatic SSL Renewal).
  # First-time issuance is manual (see plans.md L17):
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d the-musica.com -d www.the-musica.com
  certbot:
    image: certbot/certbot:v2.9.0
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # Database backup: nightly compressed pg_dump, pruning dumps older than 7 days (L22).
  backup:
    image: postgres:15-alpine
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./scripts/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - musica_net
    restart: unless-stopped
    command: >
      /bin/sh -c 'while true; do
        pg_dump -h db -U musica -d musica_db -Fc -o /backups/musica_$$(date +%Y%m%d_%H%M).dump &&
        find /backups -name "*.dump" -mtime +7 -delete;
        sleep 86400;
      done'

volumes:
  redisdata:

networks:
  musica_net:
    driver: bridge